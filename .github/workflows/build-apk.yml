name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/simple/debug/app-simple-debug.apk app-debug.apk
          cp app/build/outputs/apk/pro/debug/app-pro-debug.apk app-pro-debug.apk
          cp app-debug.apk G1-Hotelo-${{ github.run_number }}.apk
          cp app-pro-debug.apk G1-Hotelo-Pro-${{ github.run_number }}.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app-debug.apk
            app-pro-debug.apk
            G1-Hotelo-${{ github.run_number }}.apk
            G1-Hotelo-Pro-${{ github.run_number }}.apk

      - name: Update latest tag
        run: |
          git tag -f latest
          git push -f origin latest || true

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: G1 Hotelo — сборка ${{ github.run_number }}
          body: |
            Прямая ссылка на скачивание: https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk
            
            - Сборка: #${{ github.run_number }}
            - Коммит: ${{ github.sha }}
            - Дата: ${{ github.event.head_commit.timestamp }}
          files: |
            app-debug.apk
            app-pro-debug.apk
            G1-Hotelo-${{ github.run_number }}.apk
            G1-Hotelo-Pro-${{ github.run_number }}.apk
          make_latest: true
          overwrite_files: true
